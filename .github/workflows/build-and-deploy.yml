name: Build, test and deploy

on:
  push:
    branches:
      - revamp/afterlife-office-v0.2
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: afterdeathagency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Import and parse project
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit > godot-check.log 2>&1
          status=$?
          cat godot-check.log
          exit $status

  export:
    name: Export Godot builds
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export Web, Android and Windows
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          archive_output: false
          export_debug: true
          verbose: false
          cache: true

      - name: Verify exported files
        run: |
          test -f build/web/index.html
          test -f build/android/AfterDeathAgency.apk
          test -f build/windows/AfterDeathAgency.exe
          find build -maxdepth 3 -type f -printf '%p %k KB\n' | sort

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: AfterDeathAgency-Android-debug
          path: build/android/AfterDeathAgency.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package Windows build
        run: |
          cd build/windows
          zip -9 -r ../AfterDeathAgency-Windows.zip .

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: AfterDeathAgency-Windows
          path: build/AfterDeathAgency-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Web build for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy browser demo
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
