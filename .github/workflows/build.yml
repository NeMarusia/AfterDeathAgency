name: Build game and deploy demo

on:
  push:
    branches: [master, agent/mobile-release-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.4.1

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  web:
    name: Export web demo
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Godot CI environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          cp -R /root/.config/godot "$HOME/.config/godot" || true
          cp -R "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Import and validate project
        run: godot --headless --editor --quit --path .
      - name: Export web demo
        run: |
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Godot CI environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          cp -R /root/.config/godot "$HOME/.config/godot" || true
          cp -R "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version
      - name: Prepare Android debug keystore
        run: |
          mkdir -p "$HOME/.android" build/android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 || true
      - name: Import and validate project
        run: godot --headless --editor --quit --path .
      - name: Export Android APK
        run: |
          godot --headless --verbose --path . --export-debug "Android" build/android/AfterDeathAgency.apk
          test -f build/android/AfterDeathAgency.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-android
          path: build/android/AfterDeathAgency.apk
          if-no-files-found: error

  deploy:
    name: Deploy web demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
