name: Build restored game

on:
  push:
    branches: [master, restore/original-game]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.4.1

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Export original web game
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure Godot export templates
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
      - name: Import project
        run: godot --headless --path . --import
      - name: Export web demo
        run: |
          mkdir -p build/web build/ci
          set +e
          godot --headless --verbose --path . --export-release "Web" build/web/index.html 2>&1 | tee build/ci/web-export.log
          STATUS=${PIPESTATUS[0]}
          if [ ! -s build/web/index.html ]; then STATUS=1; fi
          exit "$STATUS"
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-web-diagnostics
          path: build/ci/web-export.log
          if-no-files-found: error
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-original-web
          path: build/web
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Export original Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
      DEBUG_KEYSTORE: /root/.android/debug.keystore
      DEBUG_KEY_ALIAS: androiddebugkey
      DEBUG_KEY_PASSWORD: android
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Godot and Android SDK
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare Android debug keystore
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$DEBUG_KEYSTORE")" build/android
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass "$DEBUG_KEY_PASSWORD" \
              -alias "$DEBUG_KEY_ALIAS" \
              -keypass "$DEBUG_KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=AfterDeathAgency,C=RU"
          fi
      - name: Import project
        run: godot --headless --path . --import
      - name: Export signed Android APK
        run: |
          mkdir -p build/android build/ci
          set +e
          godot --headless --verbose --path . --export-debug "Android" build/android/AfterDeathAgency-original.apk 2>&1 | tee build/ci/android-export.log
          STATUS=${PIPESTATUS[0]}
          if [ ! -s build/android/AfterDeathAgency-original.apk ]; then STATUS=1; fi
          exit "$STATUS"
      - name: Verify Android APK signature
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/android/AfterDeathAgency-original.apk
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-android-diagnostics
          path: build/ci/android-export.log
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-original-android
          path: build/android/AfterDeathAgency-original.apk
          if-no-files-found: error

  deploy:
    name: Deploy original web game
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
