name: Build game and deploy demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.4.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Export web demo
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot export templates
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          echo "HOME=$HOME"
          TEMPLATE_ROOT=/root/.local/share/godot/export_templates
          find "$TEMPLATE_ROOT" -maxdepth 2 -print
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"

      - name: Parse and import project
        run: |
          set -euxo pipefail
          godot --headless --path . --script main.gd --check-only
          godot --headless --path . --import

      - name: Export web demo
        run: |
          set -euxo pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-web
          path: build/web
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot export templates
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          echo "HOME=$HOME"
          TEMPLATE_ROOT=/root/.local/share/godot/export_templates
          find "$TEMPLATE_ROOT" -maxdepth 2 -print
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
          command -v keytool

      - name: Prepare Android debug keystore
        run: |
          set -euxo pipefail
          mkdir -p /root/.android build/android
          if [ ! -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
              -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
              -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=AfterDeathAgency,C=RU"
          fi

      - name: Parse and import project
        run: |
          set -euxo pipefail
          godot --headless --path . --script main.gd --check-only
          godot --headless --path . --import

      - name: Export Android APK
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/AfterDeathAgency.apk
          test -s build/android/AfterDeathAgency.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-android
          path: build/android/AfterDeathAgency.apk
          if-no-files-found: error

  deploy:
    name: Deploy web demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
