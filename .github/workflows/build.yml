name: Build game and deploy demo

on:
  push:
    branches: [master, feature/original-game-progression]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.4.1

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate original pixel-art game
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure repository
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
      - name: Import project
        run: godot --headless --path . --import
      - name: Verify original scene and assets
        run: godot --headless --path . --script tests/smoke_test.gd

  web:
    name: Export web demo
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure Godot export templates
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
      - name: Import project
        run: godot --headless --path . --import
      - name: Export web demo
        run: |
          mkdir -p build/web build/ci
          set +e
          godot --headless --verbose --path . --export-release "Web" build/web/index.html 2>&1 | tee build/ci/web-export.log
          STATUS=${PIPESTATUS[0]}
          if [ ! -s build/web/index.html ]; then STATUS=1; fi
          exit "$STATUS"
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-web-diagnostics
          path: build/ci/web-export.log
          if-no-files-found: error
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-web
          path: build/web
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Export Android APK
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      HOME: /root
      DEBUG_KEYSTORE: /root/.android/debug.keystore
      DEBUG_KEY_ALIAS: androiddebugkey
      DEBUG_KEY_PASSWORD: android
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Godot and Android SDK
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
      - name: Prepare Android debug keystore
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$DEBUG_KEYSTORE")" build/android
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass "$DEBUG_KEY_PASSWORD" \
              -alias "$DEBUG_KEY_ALIAS" \
              -keypass "$DEBUG_KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=AfterDeathAgency,C=RU"
          fi
      - name: Import project
        run: godot --headless --path . --import
      - name: Export signed Android APK
        run: |
          mkdir -p build/android build/ci
          set +e
          godot --headless --verbose --path . --export-debug "Android" build/android/AfterDeathAgency.apk 2>&1 | tee build/ci/android-export.log
          STATUS=${PIPESTATUS[0]}
          if [ ! -s build/android/AfterDeathAgency.apk ]; then STATUS=1; fi
          exit "$STATUS"
      - name: Verify Android APK signature
        run: |
          set -euxo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/android/AfterDeathAgency.apk
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-android-diagnostics
          path: build/ci/android-export.log
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-android
          path: build/android/AfterDeathAgency.apk
          if-no-files-found: error

  deploy:
    name: Deploy web demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'deployment-status';
            const path = 'pages-status.json';
            const payload = {
              run_id: context.runId,
              sha: context.sha,
              outcome: '${{ steps.deployment.outcome }}',
              job_status: '${{ job.status }}',
              page_url: '${{ steps.deployment.outputs.page_url }}',
              updated_at: new Date().toISOString()
            };
            let fileSha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) fileSha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: fileSha,
              message: `Record Pages deployment ${context.runId}: ${payload.outcome}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64')
            });
