name: Build game and deploy demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.4.1
  HOME: /root

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair source typing
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Apply deterministic source repair
        run: python3 tools/repair_main_types.py
      - name: Commit repair when needed
        id: commit
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- main.gd; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.gd
          git commit -m "fix GDScript type inference"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  web:
    name: Export web demo
    needs: repair
    if: needs.repair.outputs.changed != 'true'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Godot export templates
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          find "$TEMPLATE_ROOT" -maxdepth 2 -print
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
      - name: Import project
        run: godot --headless --path . --import
      - name: Export web demo
        run: |
          mkdir -p build/web build/ci
          set +e
          godot --headless --verbose --path . --export-release "Web" build/web/index.html 2>&1 | tee build/ci/web-export.log
          STATUS=${PIPESTATUS[0]}
          if [ ! -s build/web/index.html ]; then STATUS=1; fi
          exit "$STATUS"
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-web-diagnostics
          path: build/ci/web-export.log
          if-no-files-found: error
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-web
          path: build/web
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Export Android APK
    needs: repair
    if: needs.repair.outputs.changed != 'true'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure Godot export templates
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          godot --version
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          find "$TEMPLATE_ROOT" -maxdepth 2 -print
          EXPECTED="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          if [ ! -e "$EXPECTED" ]; then
            SOURCE="$(find "$TEMPLATE_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            test -n "$SOURCE"
            ln -s "$SOURCE" "$EXPECTED"
          fi
          test -e "$EXPECTED"
          command -v keytool
      - name: Prepare Android debug keystore
        run: |
          set -euxo pipefail
          mkdir -p /root/.android build/android
          if [ ! -f "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
              -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
              -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=AfterDeathAgency,C=RU"
          fi
      - name: Import project
        run: godot --headless --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build/android build/ci
          set +e
          godot --headless --verbose --path . --export-debug "Android" build/android/AfterDeathAgency.apk 2>&1 | tee build/ci/android-export.log
          STATUS=${PIPESTATUS[0]}
          if [ ! -s build/android/AfterDeathAgency.apk ]; then STATUS=1; fi
          exit "$STATUS"
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-android-diagnostics
          path: build/ci/android-export.log
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterDeathAgency-android
          path: build/android/AfterDeathAgency.apk
          if-no-files-found: error

  deploy:
    name: Deploy web demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
